name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run guard
      - run: npm test
      - run: npm run build
      - run: npm run audit:deps
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/requirements.txt }
      - run: pip install -r agent/requirements.txt
      - run: python -c "from triage_agent.agent import root_agent; print(root_agent.name)"
        working-directory: agent
  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api:ci .
      - run: docker build -t agent:ci agent

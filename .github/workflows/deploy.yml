# develop -> staging, main -> production. Create the two hooks in Render (or swap this step for Cloud Run / Railway).
# Repo secrets: RENDER_STAGING_HOOK, RENDER_PROD_HOOK. Use GitHub Environments for production approval.
name: deploy
on:
  workflow_run: { workflows: [ci], types: [completed], branches: [main, develop] }
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger deploy
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then HOOK="${{ secrets.RENDER_PROD_HOOK }}"; else HOOK="${{ secrets.RENDER_STAGING_HOOK }}"; fi
          test -n "$HOOK" || { echo "deploy hook secret not set"; exit 1; }
          curl -fsS -X POST "$HOOK"
